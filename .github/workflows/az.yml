name: Validate SPIR-V

on:                                        
  push:   
    branches: [ "spv-yz" ]  
  pull_request:
    branches: [ "spv-yz" ]

permissions:
  contents: read

jobs:
  validate-spirv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          spirv-val --version
          spirv-as --version

      - name: Validate .spv files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "::group::spirv-val $f"
            if spirv-val --target-env vulkan1.1 "$f"; then
              echo "OK: $f"
            else
              echo "::error file=$f::SPIR-V validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find . -type f -name '*.spv' -not -path './.git/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No .spv files found"
          fi
          exit $fail

      - name: Assemble and validate .spvasm files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          found=0
          while IFS= read -r -d '' f; do
            found=1
            out="$(mktemp --suffix=.spv)"
            echo "::group::spirv-as $f"
            if ! spirv-as --target-env vulkan1.1 -o "$out" "$f"; then
              echo "::error file=$f::SPIR-V assembly failed"
              fail=1
              rm -f "$out"
              echo "::endgroup::"
              continue
            fi
            echo "OK assembled: $f -> $out"
            echo "::endgroup::"

            echo "::group::spirv-val $out (from $f)"
            if spirv-val --target-env vulkan1.1 "$out"; then
              echo "OK: $f"
            else
              echo "::error file=$f::SPIR-V validation failed"
              fail=1
            fi
            echo "::endgroup::"
            rm -f "$out"
          done < <(find . -type f -name '*.spvasm' -not -path './.git/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No .spvasm files found"
          fi
          exit $fail
