name: Vertex vp_c3 UBO -> TexelBuffer

on:
  push:
    branches: [ "spv-yz" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Disassemble, convert, reassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out
          fail=0

          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            asm="work/out/${base}.spvasm"
            outspv="work/out/${base}.spv"

            spirv-dis "$f" -o "$asm"

            python3 - "$asm" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path) as fp:
              text = fp.read()

          # 1. 找 %vp_c3 的声明行
          m = re.search(
              r'^(?P<i>[ \t]*)%vp_c3\s*=\s*OpVariable\s+%_ptr_Uniform__struct_16\s+Uniform(?P<tail>.*)$',
              text, re.MULTILINE)
          if not m:
              print('  ERROR: %vp_c3 declaration not found', file=sys.stderr)
              sys.exit(2)

          indent = m.group('i')
          tail = m.group('tail')

          new_types = (
              f'{indent}%__texelbuf = OpTypeImage %float Buffer 0 0 0 1 Unknown\n'
              f'{indent}%__ptr_texelbuf = OpTypePointer UniformConstant %__texelbuf\n'
              f'{indent}%__lod0 = OpConstant %int 0\n'
          )
          new_decl = f'{indent}%vp_c3 = OpVariable %__ptr_texelbuf UniformConstant{tail}'
          text = text[:m.start()] + new_types + new_decl + text[m.end():]

          # 2. 找所有 vp_c3 的 OpAccessChain（静态+动态都抓）
          chains = {}
          for m in re.finditer(
              r'^(?P<i>[ \t]*)(?P<r>%\w+)\s*=\s*OpAccessChain\s+'
              r'%_ptr_Uniform_float\s+%vp_c3\s+%int_0\s+(?P<a>%\w+)\s+(?P<b>%\w+)\s*$',
              text, re.MULTILINE):
              chains[m.group('r')] = (m.group('a'), m.group('b'), m.group('i'))

          print(f'  found {len(chains)} access chains (static+dynamic)', file=sys.stderr)
          if not chains:
              print('  ERROR: no access chains found', file=sys.stderr)
              sys.exit(3)

          # 3. 把每个 access chain 的 OpLoad 使用者替换成 texel fetch
          counter = [0]
          def load_repl(m):
              r = m.group('r')
              if r not in chains:
                  return m.group(0)
              a, b, i = chains[r]
              counter[0] += 1
              n = counter[0]
              v = m.group('v')
              tmp = f'%__tf_{n}'
              return (f'{i}{tmp} = OpImageFetch %v4float %vp_c3 {a} Lod %__lod0\n'
                      f'{i}{v} = OpVectorExtractDynamic %float {tmp} {b}')
          text = re.sub(
              r'^(?P<i>[ \t]*)(?P<v>%\w+)\s*=\s*OpLoad\s+%float\s+(?P<r>%\w+)\s*$',
              load_repl, text, flags=re.MULTILINE)

          print(f'  replaced {counter[0]} loads', file=sys.stderr)

          # 4. 删除所有原始 OpAccessChain
          removed = 0
          for r in chains:
              new_text, n = re.subn(
                  r'^[ \t]*' + re.escape(r) + r'\s*=\s*OpAccessChain\s+'
                  r'%_ptr_Uniform_float\s+%vp_c3\s+%int_0\s+%\w+\s+%\w+\s*\n',
                  '', text, flags=re.MULTILINE)
              if n:
                  removed += n
                  text = new_text
          print(f'  removed {removed} access chains', file=sys.stderr)

          with open(path, 'w') as fp:
              fp.write(text)
          PYEOF

            echo "::group::spirv-as $f"
            if ! spirv-as --target-env vulkan1.1 "$asm" -o "$outspv"; then
              echo "::error file=$f::spirv-as failed"
              fail=1
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"

            echo "::group::spirv-val $outspv"
            if ! spirv-val --target-env vulkan1.1 "$outspv" 2>&1 | tee /tmp/val.out; then
              echo "::error file=$f::spirv-val failed (see log above)"
              cat /tmp/val.out
              fail=1
              echo "::endgroup::"
              continue
            fi
            echo "OK: $f -> $outspv"
            echo "::endgroup::"
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          exit $fail

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vertex-texelbuffer
          path: |
            work/out/*.spv
            work/out/*.spvasm
          if-no-files-found: warn
          retention-days: 14
