name: Dump dynamic index definition chains

on:
  push:
    branches: [ "spv-yz" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Disassemble + dump chains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          : > work/list.txt
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/${base}.spv"
            echo "${base}|$f" >> work/list.txt
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          while IFS='|' read -r base src; do
            spirv-dis "work/${base}.spv" -o "work/${base}.spvasm"

            # 建一个 %id -> 定义行的索引
            awk '
              /^ *%[0-9]+ = / { id=$1; line=$0; defs[id]=line }
              { lines[NR]=$0 }
              END {
                # 输出全部定义
                for (k in defs) print k "\t" defs[k]
              }' "work/${base}.spvasm" | sort -V > "work/${base}.defs.txt"

            # 抓出 156 条动态访问的 a、b SSA id
            grep -nE 'OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 %[0-9]+ %[0-9]+' "work/${base}.spvasm" \
              | grep -vE '%int_[0-9]+ %int_[0-9]+$' \
              | awk '{print $NF, $(NF-1)}' \
              | sort -u > "work/${base}.dyn_ids.txt"

            echo "=========== $base ==========="
            echo "dynamic accesses found: $(wc -l < work/${base}.dyn_ids.txt)"

            # 对每个 a 索引，向上追 8 层定义，看它怎么算出来的
            : > "work/${base}.chains.txt"
            while read -r b a; do
              echo "--- a=$a b=$b ---" >> "work/${base}.chains.txt"
              cur="$a"
              for depth in 1 2 3 4 5 6 7 8; do
                def=$(grep -m1 -P "^\Q${cur}\E\s+=" "work/${base}.defs.txt" | cut -f2- || true)
                [ -z "$def" ] && break
                echo "  [$depth] $def" >> "work/${base}.chains.txt"
                # 从定义里取第一个源操作数
                next=$(echo "$def" | grep -oE '%[0-9]+' | sed -n '2p')
                [ -z "$next" ] && break
                cur="$next"
              done
              echo "" >> "work/${base}.chains.txt"
            done < "work/${base}.dyn_ids.txt"

            echo "---- first 3 chains ----"
            head -40 "work/${base}.chains.txt"
          done < work/list.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: index-chains
          path: |
            work/*.chains.txt
            work/*.dyn_ids.txt
            work/*.defs.txt
          if-no-files-found: error
          retention-days: 14
