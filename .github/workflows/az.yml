name: Generate Test10 Shader

on:
  push:   
    branches: [ "jiaoben" ]  
  pull_request:
    branches: [ "jiaoben" ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # 如果需要从私有仓库拉取，可以添加 token
        # with:
        #   token: ${{ secrets.GITLAB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run replacement script
        run: python prepare_test10.py

      - name: Upload test10.comp as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test10-shader
          path: test10.comp

      - name: Install glslang-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Compile test10.comp to SPIR-V
        run: |
          glslangValidator -V test10.comp -o test10.spv

      - name: Upload SPIR-V binary
        uses: actions/upload-artifact@v4
        with:
          name: test10-spv
          path: test10.spv
