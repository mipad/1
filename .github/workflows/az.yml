name: Disassemble SPIR-V

on:
  # 手动触发（推荐，手机上最方便）
  workflow_dispatch:

  # 推送到 shaders/ 目录时自动触发
  push:
    paths:
      - 'shaders/**.spv'

jobs:
  disassemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Show tool versions
        run: |
          spirv-dis --version
          spirv-val --version

      - name: List SPIR-V files
        run: |
          echo "SPIR-V files found:"
          find shaders -name "*.spv" -type f | sort

      - name: Validate SPIR-V files
        run: |
          mkdir -p output
          for file in $(find shaders -name "*.spv" -type f); do
            echo "========================================"
            echo "Validating: $file"
            echo "========================================"
            if spirv-val "$file"; then
              echo "[OK] $file is valid."
            else
              echo "[FAIL] $file is INVALID!"
            fi
            echo
          done

      - name: Disassemble SPIR-V files
        run: |
          mkdir -p output
          for file in $(find shaders -name "*.spv" -type f); do
            base=$(basename "$file" .spv)
            echo "Disassembling: $file -> output/${base}.spvasm"
            spirv-dis "$file" -o "output/${base}.spvasm"
          done

      - name: Cross-compile to GLSL (可选，辅助理解)
        run: |
          sudo apt-get install -y spirv-cross
          mkdir -p output_glsl
          for file in $(find shaders -name "*.spv" -type f); do
            base=$(basename "$file" .spv)
            # 根据文件名判断阶段
            if echo "$base" | grep -qi "vertex"; then
              stage="vert"
            elif echo "$base" | grep -qi "fragment"; then
              stage="frag"
            elif echo "$base" | grep -qi "compute"; then
              stage="comp"
            else
              stage="vert"
            fi
            echo "Cross-compiling: $file -> output_glsl/${base}.glsl (stage=$stage)"
            spirv-cross "$file" --output "output_glsl/${base}.glsl" --stage "$stage" || echo "  (skipped, may not be supported)"
          done

      - name: Show disassembly summary
        run: |
          echo "===== Disassembly Summary ====="
          for file in output/*.spvasm; do
            echo
            echo "--- $file ---"
            echo "Total lines: $(wc -l < "$file")"
            echo "OpSpecConstantOp count: $(grep -c 'OpSpecConstantOp' "$file" || true)"
            echo "OpPhi count:            $(grep -c 'OpPhi' "$file" || true)"
            echo "OpLoopMerge count:      $(grep -c 'OpLoopMerge' "$file" || true)"
            echo "OpVectorShuffle count:  $(grep -c 'OpVectorShuffle' "$file" || true)"
            echo "OpFunctionCall count:   $(grep -c 'OpFunctionCall' "$file" || true)"
            echo "OpImageSample* count:   $(grep -c 'OpImageSample' "$file" || true)"
          done

      - name: Upload disassembled files (.spvasm)
        uses: actions/upload-artifact@v4
        with:
          name: spirv-disassembly
          path: output/*.spvasm
          if-no-files-found: warn

      - name: Upload GLSL files (可选)
        uses: actions/upload-artifact@v4
        with:
          name: spirv-cross-glsl
          path: output_glsl/*.glsl
          if-no-files-found: ignore
