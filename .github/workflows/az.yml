name: Compile Test Shaders

on:
  push:
    branches: [ "jiaoben" ]
  pull_request:
    branches: [ "jiaoben" ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run all prepare scripts
        run: |
          for script in prepare_*.py; do
            echo "Running $script"
            python "$script"
          done

      - name: Install glslang-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Compile all test*.comp files
        run: |
          shopt -s nullglob
          for comp in test*.comp; do
            echo "Compiling $comp -> ${comp%.comp}.spv"
            glslangValidator -V "$comp" -o "${comp%.comp}.spv"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-test-shaders
          path: |
            test*.comp
            test*.spv
