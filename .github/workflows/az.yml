name: Generate Test10 Shader

on:
push:   
    branches: [ "jiaoben" ]  
  pull_request:
    branches: [ "jiaoben" ]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # 如果原始着色器文件在私有仓库中，参考 az (9).yml 中的方式指定 token
        # with:
        #   token: ${{ secrets.GITLAB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run replacement script
        run: python prepare_test10.py

      - name: Upload test10.comp as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test10-shader
          path: test10.comp

      - name: (Optional) Compile with glslangValidator
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          glslangValidator -V test10.comp -o test10.spv
