name: Shrink vp_c3 UBO size

on:
  push:
    branches: [ "spv-yz" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Prepare + shrink + reassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out
          fail=0
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            asm="work/out/${base}.orig.spvasm"
            out_asm="work/out/${base}.spvasm"
            out_spv="work/out/${base}.spv"

            spirv-dis "$f" -o "$asm"

            # 把 4096 改成 256；只改 OpConstant 声明，不动 OpTypeArray 的引用
            sed -E 's/^(\s*)%uint_4096 = OpConstant %uint 4096\s*$/\1%uint_4096 = OpConstant %uint 256/' \
              "$asm" > "$out_asm"

            if ! spirv-as --target-env vulkan1.1 "$out_asm" -o "$out_spv"; then
              echo "::error file=$f::spirv-as failed"
              fail=1
              continue
            fi
            if ! spirv-val --target-env vulkan1.1 "$out_spv"; then
              echo "::error file=$f::spirv-val failed"
              fail=1
              continue
            fi
            echo "OK: $f -> $out_spv"
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)
          exit $fail

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vertex-shrunk-ubo
          path: |
            work/out/*.spv
            work/out/*.spvasm
          if-no-files-found: error
          retention-days: 14
