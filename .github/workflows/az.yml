name: Extract dynamic uniform index

on:                                        
  push:   
    branches: [ "spv-yz" ]  
  pull_request:
    branches: [ "spv-yz" ]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/disasm
          : > work/list.txt
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/${base}.spv"
            echo "${base}|$f" >> work/list.txt
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spvasm}")"
            [ -f "work/${base}.spv" ] && continue
            spirv-as --target-env vulkan1.1 -o "work/${base}.spv" "$f" || true
            [ -f "work/${base}.spv" ] && echo "${base}|$f" >> work/list.txt
          done < <(find . -type f -name 'Vertex_*.spvasm' -not -path './.git/*' -not -path './work/*' -print0)

          while IFS='|' read -r base src; do
            spirv-dis "work/${base}.spv" -o "work/disasm/${base}.spvasm"
          done < work/list.txt
          ls -la work/disasm

      - name: Dump dynamic uniform accesses
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# 动态索引 uniform 访问明细"
            echo ""
            echo "抓取形如 \`OpAccessChain %_ptr_Uniform_* %var %int_0 <dyn> <dyn>\` 的指令，"
            echo "其中 \`<dyn>\` 不是 int_N 常量。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS='|' read -r base src; do
            asm="work/disasm/${base}.spvasm"
            out="work/${base}.dynidx.txt"
            : > "$out"

            # 抓 OpAccessChain 指向 Uniform 变量的行
            # 匹配 %_ptr_Uniform_* %support_buffer 或 %vp_c3
            # 用 awk 提取每行末尾两个索引，判断是否是常量
            grep -nE 'OpAccessChain %_ptr_Uniform' "$asm" > /tmp/ac.txt || true

            # 对每行：把行按空格拆，找出 %var 后面跟的所有 %xxx
            # 如果最后两个中任一个不是 %int_<数字>，则算动态
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              # 提取所有 %开头的 token
              ids=$(echo "$line" | grep -oE '%[A-Za-z0-9_]+' | tr '\n' ' ')

              # 找到 %int_0 之后的部分（索引）
              after=$(echo "$ids" | sed -n 's/.*%int_0 \(.*\)$/\1/p')
              [ -z "$after" ] && continue

              # 判断 after 中的每个 id 是不是 int_ 前缀
              dyn=0
              for t in $after; do
                case "$t" in
                  %int_[0-9]*) ;;
                  *) dyn=1 ;;
                esac
              done
              [ "$dyn" -eq 1 ] && echo "$line" >> "$out"
            done < /tmp/ac.txt

            count=$(wc -l < "$out" | tr -d ' ')
            echo "## \`$src\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "动态索引访问：**$count** 条" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -60 "$out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "=== $src: $count dynamic accesses ==="
            head -20 "$out"
          done < work/list.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vertex-dynidx
          path: |
            work/*.dynidx.txt
            work/disasm/*.spvasm
          if-no-files-found: error
          retention-days: 14
