name: Patch dynamic uniform index (vertex)

on:
  push:
    branches: [ "spv-yz" ]
  pull_request:
    branches: [ "spv-yz" ]

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/in
          : > work/list.txt
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/in/${base}.spv"
            echo "${base}|$f" >> work/list.txt
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)
          echo "Found $(wc -l < work/list.txt) file(s)"

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r base src; do
            spirv-dis "work/in/${base}.spv" -o "work/in/${base}.spvasm"
          done < work/list.txt

      - name: Save patcher
        shell: bash
        run: |
          cat > patch.py <<'PYEOF'
          import re, sys

          def ensure_constants(text):
              missing = []
              if '%int_4095 = OpConstant %int 4095' not in text:
                  missing.append('%int_4095 = OpConstant %int 4095')
              if not re.search(r'^\s*%int_3 = OpConstant %int 3\b', text, re.MULTILINE):
                  missing.append('%int_3 = OpConstant %int 3')
              if not missing:
                  return text
              m = re.search(r'^\s*%\d+\s*=\s*OpFunction\b', text, re.MULTILINE)
              if not m:
                  return text
              inject = '\n'.join('    ' + line for line in missing) + '\n'
              return text[:m.start()] + inject + text[m.start():]

          PAT = re.compile(
              r'^(?P<indent>[ \t]*)(?P<res>%\w+)\s*=\s*OpAccessChain\s+'
              r'%_ptr_Uniform_float\s+%vp_c3\s+%int_0\s+(?P<a>%\w+)\s+(?P<b>%\w+)[ \t]*$',
              re.MULTILINE)

          def is_const(tok):
              return bool(re.match(r'%int_\d+$', tok))

          def patch_clamp(text):
              text = ensure_constants(text)
              counter = [0]
              def repl(m):
                  a, b = m.group('a'), m.group('b')
                  if is_const(a) and is_const(b):
                      return m.group(0)
                  counter[0] += 1
                  n = counter[0]
                  i, r = m.group('indent'), m.group('res')

                  head = ''
                  if not is_const(a):
                      lo, hi = f'%__cl_a_{n}_lo', f'%__cl_a_{n}_hi'
                      head += (f'{i}{lo} = OpSMax %int {a} %int_0\n'
                               f'{i}{hi} = OpSMin %int {lo} %int_4095\n')
                      a = hi
                  if not is_const(b):
                      lo, hi = f'%__cl_b_{n}_lo', f'%__cl_b_{n}_hi'
                      head += (f'{i}{lo} = OpSMax %int {b} %int_0\n'
                               f'{i}{hi} = OpSMin %int {lo} %int_3\n')
                      b = hi

                  return f'{head}{i}{r} = OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 {a} {b}'
              out = PAT.sub(repl, text)
              print(f'  clamp: patched {counter[0]} accesses', file=sys.stderr)
              return out

          def patch_constant(text):
              counter = [0]
              def repl(m):
                  if is_const(m.group('a')) and is_const(m.group('b')):
                      return m.group(0)
                  counter[0] += 1
                  return (f"{m.group('indent')}{m.group('res')} = "
                          f"OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 %int_0 %int_0")
              out = PAT.sub(repl, text)
              print(f'  constant: patched {counter[0]} accesses', file=sys.stderr)
              return out

          mode, infile, outfile = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(infile) as f:
              text = f.read()
          if mode == 'clamp':
              out = patch_clamp(text)
          elif mode == 'constant':
              out = patch_constant(text)
          else:
              sys.exit(f'unknown mode {mode}')
          with open(outfile, 'w') as f:
              f.write(out)
          PYEOF

      - name: Apply clamp patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/clamp work/constant
          while IFS='|' read -r base src; do
            echo "=== $base (clamp) ==="
            python3 patch.py clamp "work/in/${base}.spvasm" "work/clamp/${base}.spvasm"
            spirv-as --target-env vulkan1.1 "work/clamp/${base}.spvasm" -o "work/clamp/${base}.spv"
            spirv-val --target-env vulkan1.1 "work/clamp/${base}.spv"
          done < work/list.txt

      - name: Apply constant patch
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r base src; do
            echo "=== $base (constant) ==="
            python3 patch.py constant "work/in/${base}.spvasm" "work/constant/${base}.spvasm"
            spirv-as --target-env vulkan1.1 "work/constant/${base}.spvasm" -o "work/constant/${base}.spv"
            spirv-val --target-env vulkan1.1 "work/constant/${base}.spv"
          done < work/list.txt

      - name: Compare patched vs original (dynamic access count)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Patch results"
            echo ""
            echo "| file | variant | dynamic accesses remaining |"
            echo "|---|---|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r base src; do
            for v in clamp constant; do
              asm="work/${v}/${base}.spvasm"
              dyn=$(grep -E 'OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 %[0-9A-Za-z_]+ %[0-9A-Za-z_]+' "$asm" \
                    | grep -vE '%int_[0-9]+ %int_[0-9]+$' | wc -l || true)
              echo "| \`$base\` | $v | $dyn |" >> "$GITHUB_STEP_SUMMARY"
            done
          done < work/list.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vertex-patched
          path: |
            work/clamp/*.spv
            work/clamp/*.spvasm
            work/constant/*.spv
            work/constant/*.spvasm
          if-no-files-found: error
          retention-days: 14
