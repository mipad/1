name: Vertex GLSL Round-trip (Mali workaround)

on:                                        
  push:   
    branches: [ "spv-yz" ]  
  pull_request:
    branches: [ "spv-yz" ]

permissions:
  contents: read

jobs:
  vertex-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools spirv-cross glslang-tools
          spirv-val --version
          spirv-cross --help | head -1 || true
          glslangValidator --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/in work/out work/glsl
          : > work/inputs.txt

          # 只收集 Vertex_*.spv
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/in/${base}.spv"
            echo "${base}|$f" >> work/inputs.txt
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          # 也收集 .spvasm 形式的 Vertex（汇编后一起处理）
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spvasm}")"
            # 跳过已经同名 .spv 的
            [ -f "work/in/${base}.spv" ] && continue
            out="work/in/${base}.spv"
            if spirv-as --target-env vulkan1.1 -o "$out" "$f"; then
              echo "${base}|$f" >> work/inputs.txt
            fi
          done < <(find . -type f -name 'Vertex_*.spvasm' -not -path './.git/*' -not -path './work/*' -print0)

          echo "Found $(wc -l < work/inputs.txt) vertex shader(s)"
          cat work/inputs.txt

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r base src; do
            echo "::group::spirv-val work/in/${base}.spv"
            if spirv-val --target-env vulkan1.1 "work/in/${base}.spv"; then
              echo "OK: $src"
            else
              echo "::error file=$src::input SPIR-V validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: SPIR-V -> GLSL (spirv-cross)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r base src; do
            in="work/in/${base}.spv"
            out="work/glsl/${base}.vert"
            echo "::group::spirv-cross $in -> $out"
            if spirv-cross \
                --version 450 \
                --no-es \
                --output "$out" \
                "$in"; then
              echo "OK: $out"
            else
              echo "::error file=$src::spirv-cross failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: GLSL -> SPIR-V (glslangValidator)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r base src; do
            glsl="work/glsl/${base}.vert"
            out="work/out/${base}.rt.spv"
            [ -f "$glsl" ] || continue
            echo "::group::glslangValidator $glsl -> $out"
            if glslangValidator \
                -V \
                --target-env vulkan1.1 \
                "$glsl" \
                -o "$out"; then
              echo "OK: $out"
            else
              echo "::error file=$src::glslangValidator failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: Validate round-tripped output
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r base src; do
            out="work/out/${base}.rt.spv"
            [ -f "$out" ] || continue
            echo "::group::spirv-val $out"
            if spirv-val --target-env vulkan1.1 "$out"; then
              echo "OK: $out"
            else
              echo "::error file=$src::round-tripped SPIR-V validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: Interface check (EntryPoint / IO / Decorate)
        shell: bash
        run: |
          set -euo pipefail
          echo "### Interface diff (original vs round-trip)" >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r base src; do
            a="work/in/${base}.spv"
            b="work/out/${base}.rt.spv"
            [ -f "$b" ] || continue

            spirv-dis "$a" | grep -E 'OpEntryPoint|OpVariable.*(Input|Output)|OpDecorate' | sort > /tmp/a.txt
            spirv-dis "$b" | grep -E 'OpEntryPoint|OpVariable.*(Input|Output)|OpDecorate' | sort > /tmp/b.txt

            echo "#### \`$src\`" >> "$GITHUB_STEP_SUMMARY"
            if diff -u /tmp/a.txt /tmp/b.txt > /tmp/d.txt; then
              echo "Interface identical." >> "$GITHUB_STEP_SUMMARY"
              echo "OK: $src interface identical"
            else
              echo '```diff' >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/d.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "::warning file=$src::interface differs after round-trip (see summary)"
            fi
          done < work/inputs.txt

      - name: Rename for drop-in replacement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/dropin
          while IFS='|' read -r base src; do
            out="work/out/${base}.rt.spv"
            [ -f "$out" ] || continue
            # 去掉 .rt 后缀，让文件名与原始一致
            cp "$out" "work/dropin/${base}.spv"
            # 同时输出反汇编方便 review
            spirv-dis "$out" > "work/dropin/${base}.rt.spvasm"
          done < work/inputs.txt
          ls -la work/dropin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vertex-roundtrip
          path: |
            work/out/*.rt.spv
            work/glsl/*.vert
            work/dropin/*.spv
            work/dropin/*.rt.spvasm
          if-no-files-found: error
          retention-days: 14
