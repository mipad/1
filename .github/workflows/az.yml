name: Ryujinx Android Build with dex2rs Protectio

on:
  push:
    branches: [ "my" ]
  pull_request:
    branches: [ "my" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 增加超时，为 dex2rs 的 Rust 编译留出时间

    env:
      JAVA_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=4g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
      PROJECT_DIR: src/RyujinxAndroid
      ANDROID_NDK_VERSION: "29.0.14206865"
      DOTNET_VERSION: "10.0.201"
      ANDROID_API_LEVEL: "36"
      GRADLE_VERSION: "9.2.0"
      ANDROID_BUILD_TOOLS: "36.0.0"
      RUST_TARGET: "aarch64-linux-android"

    steps:
    # ========== 1. 从 GitLab 检出代码 ==========
    - name: Checkout code from GitLab
      uses: actions/checkout@v4
      with:
        github-server-url: https://gitlab.com
        repository: mipad1-group/Test-ryu
        ref: my-nce-vp9-5
        path: Test-ryu
        token: ${{ secrets.GITLAB_TOKEN }}

    # ========== 2. 环境配置 ==========
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        architecture: x64

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # ========== 3. 缓存 ==========
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # ========== 4. 权限和 Gradle Wrapper ==========
    - name: Set execution permissions
      working-directory: ${{ github.workspace }}/Test-ryu
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        find . -name "*.sh" -exec chmod +x {} \;

    - name: Setup Gradle Wrapper
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version=${{ env.GRADLE_VERSION }}
        fi

    # ========== 5. Android SDK / NDK 与路径 ==========
    - name: Install Android SDK Components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
          "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
          "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
          "cmake;3.22.1" \
          "ndk;${{ env.ANDROID_NDK_VERSION }}"

    - name: Configure Environment Paths
      shell: bash
      run: |
        ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}"
        LLVM_PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        LIB_DIR="$LLVM_PATH/sysroot/usr/lib/aarch64-linux-android/${{ env.ANDROID_API_LEVEL }}"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "LLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
        echo "LIB_DIR=$LIB_DIR" >> $GITHUB_ENV
        echo "$LLVM_PATH/bin" >> $GITHUB_PATH

    - name: Install Ninja Build
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    # ========== 6. 主构建流程（Ryujinx） ==========
    - name: Build APK
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      env:
        OPENSSL_ROOT_DIR: /opt/openssl-x64
      run: |
        ./gradlew clean assembleRelease \
          -DllvmToolchainPath=$LLVM_PATH \
          -Dopenssl.root=$OPENSSL_ROOT_DIR \
          -Pandroid.overridePathCheck=true \
          --no-daemon \
          --stacktrace

    # ========== 7. dex2rs 工具链安装与加固 ==========
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ env.RUST_TARGET }}

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Install dex2rs
      run: cargo binstall dex2rs -y || cargo install dex2rs
      # binstall 优先取预编译版本，失败时回退到源码编译

    - name: Create dex2rs filter file
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      run: |
        cat << 'EOF' > filter.txt
        # 保护 Ryujinx Android 的主要包
        # 根据实际包名调整，这里以 org/ryujinx/android 为例
        org/ryujinx/android/.*;.*
        # 排除 R 类和 BuildConfig 等无需转换的自动生成类
        !org/ryujinx/android/R;.*
        !org/ryujinx/android/R$.*;.*
        !org/ryujinx/android/BuildConfig;.*
        EOF

    - name: Find built APK
      id: find-apk
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "::error::No APK found for dex2rs input"
          exit 1
        fi
        echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Input APK: $APK_PATH"

    - name: Run dex2rs protection
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      run: |
        dex2rs \
          -i "${{ steps.find-apk.outputs.APK_PATH }}" \
          -o "app-protected.apk" \
          -f filter.txt \
          --abis arm64-v8a \
          -k
        # -k 保留原始签名（debug 签名），便于在 CI 中直接安装测试
        # 如需正式发布，去掉 -k 并用自己的 keystore 重新签名

    # ========== 8. 产物上传 ==========
    - name: Upload original APK
      uses: actions/upload-artifact@v4
      with:
        name: ryujinx-original
        path: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
        retention-days: 7

    - name: Upload dex2rs protected APK
      uses: actions/upload-artifact@v4
      with:
        name: ryujinx-protected
        path: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}/app-protected.apk
        retention-days: 7

    - name: Upload Build Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports
        path: |
          ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}/app/build/reports/
          ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}/build/reports/
        retention-days: 3
