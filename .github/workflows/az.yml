name: Optimize SPIR-V (Mali-friendly)

on:                                        
  push:   
    branches: [ "spv-yz" ]  
  pull_request:
    branches: [ "spv-yz" ]
    inputs:
      opt_flags:
        description: 'spirv-opt 标志 (空格分隔)'
        required: false
        default: '-O --scalar-replacement --convert-local-access-chains --eliminate-dead-variables'

permissions:
  contents: read

jobs:
  optimize-spirv:
    runs-on: ubuntu-latest
    env:
      OPT_FLAGS: ${{ github.event.inputs.opt_flags || '-O --scalar-replacement --convert-local-access-chains --eliminate-dead-variables' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          spirv-val --version
          spirv-opt --version
          spirv-dis --version
          spirv-as --version

      - name: Prepare input list
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/in work/out
          : > work/inputs.txt

          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/in/${base}.spv"
            echo "${base}|spv|$f" >> work/inputs.txt
          done < <(find . -type f -name '*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spvasm}")"
            out="work/in/${base}.spv"
            if spirv-as --target-env vulkan1.1 -o "$out" "$f"; then
              echo "${base}|spvasm|$f" >> work/inputs.txt
            else
              echo "::error file=$f::spirv-as failed"
              exit 1
            fi
          done < <(find . -type f -name '*.spvasm' -not -path './.git/*' -not -path './work/*' -print0)

          echo "Found $(wc -l < work/inputs.txt) file(s)"

      - name: Validate inputs first
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r base kind src; do
            echo "::group::spirv-val work/in/${base}.spv (from $src)"
            if spirv-val --target-env vulkan1.1 "work/in/${base}.spv"; then
              echo "OK: $src"
            else
              echo "::error file=$src::input SPIR-V validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: Count Function-scope OpVariable BEFORE
        shell: bash
        run: |
          set -euo pipefail
          echo "### OpVariable count BEFORE optimization" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Function | Total |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r base kind src; do
            spv="work/in/${base}.spv"
            total=$(spirv-dis "$spv" | grep -cE 'OpVariable' || true)
            func=$(spirv-dis "$spv" | grep -cE 'OpVariable .* Function' || true)
            echo "| \`$src\` | $func | $total |" >> "$GITHUB_STEP_SUMMARY"
            echo "$src: Function-scope=$func total=$total"
          done < work/inputs.txt

      - name: Show available spirv-opt passes (for debugging)
        shell: bash
        run: |
          spirv-opt --help 2>&1 | sed -n '1,120p'

      - name: Optimize (conservative, Mali-friendly)
        shell: bash
        run: |
          set -euo pipefail
          echo "Using OPT_FLAGS=$OPT_FLAGS"
          fail=0
          while IFS='|' read -r base kind src; do
            in="work/in/${base}.spv"
            out="work/out/${base}.opt.spv"
            echo "::group::spirv-opt $OPT_FLAGS $in"

            # shellcheck disable=SC2086
            if spirv-opt \
                --target-env=vulkan1.1 \
                $OPT_FLAGS \
                -o "$out" "$in"; then
              echo "OK: $src -> $out"
            else
              echo "::error file=$src::spirv-opt failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: Validate optimized output
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS='|' read -r base kind src; do
            out="work/out/${base}.opt.spv"
            [ -f "$out" ] || continue
            echo "::group::spirv-val $out"
            if spirv-val --target-env vulkan1.1 "$out"; then
              echo "OK: $out"
            else
              echo "::error file=$src::optimized SPIR-V validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done < work/inputs.txt
          exit $fail

      - name: Count Function-scope OpVariable AFTER
        shell: bash
        run: |
          set -euo pipefail
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### OpVariable count AFTER optimization" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Function | Total |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r base kind src; do
            out="work/out/${base}.opt.spv"
            [ -f "$out" ] || continue
            total=$(spirv-dis "$out" | grep -cE 'OpVariable' || true)
            func=$(spirv-dis "$out" | grep -cE 'OpVariable .* Function' || true)
            echo "| \`$src\` | $func | $total |" >> "$GITHUB_STEP_SUMMARY"
            echo "$src: Function-scope=$func total=$total"
          done < work/inputs.txt

      - name: Disassemble optimized output
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r base kind src; do
            out="work/out/${base}.opt.spv"
            [ -f "$out" ] || continue
            spirv-dis "$out" > "work/out/${base}.opt.spvasm"
          done < work/inputs.txt
          ls -la work/out

      - name: Upload optimized artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spirv-optimized
          path: |
            work/out/*.spv
            work/out/*.opt.spvasm
          if-no-files-found: error
          retention-days: 14
