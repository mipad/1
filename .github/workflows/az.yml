name: Vertex vp_c3 UBO -> TexelBuffer

on:
  push:
    branches: [ "spv-yz" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Disassemble, convert, reassemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/out work/in
          fail=0

          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/in/${base}.spv"
            spirv-dis "$f" -o "work/out/${base}.spvasm"

            python3 - "work/out/${base}.spvasm" <<'PYEOF'
          import re, sys
          path = sys.argv[1]
          with open(path) as fp:
              text = fp.read()

          # 1. 加 texel buffer 类型 + 指针类型（放在 OpTypeImage 之后或文件顶部附近）
          extra_types = (
              "%__tb = OpTypeImage %float Buffer 0 0 0 1 Unknown\n"
              "%_ptr_UniformConstant_tb = OpTypePointer UniformConstant %__tb\n"
              "%int_0 = OpConstant %int 0\n"
          )
          # 在第一个 OpFunction 前插入类型
          m = re.search(r'^\s*%\d+\s*=\s*OpFunction\b', text, re.MULTILINE)
          text = text[:m.start()] + "    " + extra_types.replace("\n", "\n    ").strip() + "\n" + text[m.start():]

          # 2. vp_c3 变量：从 Uniform 指针改成 UniformConstant texel buffer
          text = re.sub(
              r'%vp_c3\s*=\s*OpVariable\s+%_ptr_Uniform__struct_16\s+Uniform',
              '%vp_c3 = OpVariable %_ptr_UniformConstant_tb UniformConstant',
              text)

          # 3. 所有 OpAccessChain + OpLoad 模式：
          #    %r = OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 %a %b
          #    %v = OpLoad %float %r
          #  改成：
          #    %__v4_N = OpImageFetch %v4float %vp_c3 %a Lod %int_0
          #    %v = OpVectorExtractDynamic %float %__v4_N %b
          pat = re.compile(
              r'^(?P<i>[ \t]*)(?P<r>%\w+)\s*=\s*OpAccessChain\s+'
              r'%_ptr_Uniform_float\s+%vp_c3\s+%int_0\s+(?P<a>%\w+)\s+(?P<b>%\w+)\s*\n'
              r'(?P<i2>[ \t]*)(?P<v>%\w+)\s*=\s*OpLoad\s+%float\s+%(?P=r)\s*$',
              re.MULTILINE)

          counter = [0]
          def repl(m):
              counter[0] += 1
              n = counter[0]
              i, a, b, v = m.group('i'), m.group('a'), m.group('b'), m.group('v')
              tmp = f'%__tf_{n}'
              return (f'{i}{tmp} = OpImageFetch %v4float %vp_c3 {a} Lod %int_0\n'
                      f'{i}{v} = OpVectorExtractDynamic %float {tmp} {b}')
          text = pat.sub(repl, text)
          print(f'  replaced {counter[0]} accesses', file=sys.stderr)

          with open(path, 'w') as fp:
              fp.write(text)
          PYEOF

            spirv-as --target-env vulkan1.1 "work/out/${base}.spvasm" -o "work/out/${base}.spv" || { echo "::error file=$f::spirv-as failed"; fail=1; continue; }
            spirv-val --target-env vulkan1.1 "work/out/${base}.spv" || { echo "::error file=$f::spirv-val failed"; fail=1; continue; }
            echo "OK: $f -> work/out/${base}.spv"
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          exit $fail

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vertex-texelbuffer
          path: |
            work/out/*.spv
            work/out/*.spvasm
          if-no-files-found: error
          retention-days: 14
