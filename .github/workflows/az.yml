name: Dump dynamic index context

on:
  push:
    branches: [ "spv-yz" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: Dump context around dynamic accesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            spirv-dis "$f" -o "work/${base}.spvasm"

            # 找所有动态索引访问的行号
            grep -nE 'OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 %[0-9]+ %[0-9]+' "work/${base}.spvasm" \
              | grep -vE '%int_[0-9]+ %int_[0-9]+$' \
              | cut -d: -f1 > "work/${base}.lines.txt"

            total=$(wc -l < "work/${base}.lines.txt")
            echo "Found $total dynamic accesses in $base"

            # 抓每条的索引定义（%a 和 %b 各自往前追 5 条指令的上下文）
            : > "work/${base}.context.txt"

            # 先把所有 SSA 定义做成一个可查文件
            grep -E '^\s+%[0-9]+ = ' "work/${base}.spvasm" > "work/${base}.defs.txt"

            count=0
            while read -r ln; do
              count=$((count+1))
              # 抓这一行
              line=$(sed -n "${ln}p" "work/${base}.spvasm")

              # 提取 %a %b
              a=$(echo "$line" | grep -oE '%[0-9]+' | tail -2 | head -1)
              b=$(echo "$line" | grep -oE '%[0-9]+' | tail -1)

              echo "=== [$count] line $ln: a=$a b=$b ===" >> "work/${base}.context.txt"

              # 找 a 的直接定义（多次）
              for id in "$a" "$b"; do
                echo "  $id defined by:" >> "work/${base}.context.txt"
                grep -E "^\s+${id} = " "work/${base}.defs.txt" >> "work/${base}.context.txt" || echo "    (not found)" >> "work/${base}.context.txt"
              done
              echo "" >> "work/${base}.context.txt"

              # 前 10 条就够看
              [ "$count" -ge 10 ] && break
            done < "work/${base}.lines.txt"

            echo "---- preview ----"
            head -60 "work/${base}.context.txt"
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dyn-index-context
          path: |
            work/*.context.txt
            work/*.defs.txt
            work/*.lines.txt
            work/*.spvasm
          if-no-files-found: error
          retention-days: 14
