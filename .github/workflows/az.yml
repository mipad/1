name: Analyze SPIR-V (with fallback)

on:
  workflow_dispatch:
  push:
    paths:
      - 'crash_log.txt'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and decode SPIR-V
        run: |
          echo "Extracting SPIR-V chunks..."
          grep -E "SPV_CHUNK_" crash_log.txt | sed 's/.*SPV_CHUNK_[0-9]*://' | tr -d '\n' > spv_base64.txt
          if [ -s spv_base64.txt ]; then
            base64 -d spv_base64.txt > problem_frag.spv
            echo "Decoded SPIR-V size: $(wc -c < problem_frag.spv) bytes"
          else
            echo "No SPV_CHUNK_ found in crash_log.txt. Please check log file."
            exit 1
          fi

      # ---------- 尝试 A：使用公共的 malioc Docker 镜像 ----------
      - name: Try malioc via Docker
        id: malioc_docker
        continue-on-error: true   # 失败不中断，走备用方案
        run: |
          docker pull ryleck/mali-offline-compiler:latest
          docker run --rm -v $PWD:/work ryleck/mali-offline-compiler:latest malioc -c Valhall /work/problem_frag.spv > malioc_output.txt 2>&1
          cat malioc_output.txt

      # ---------- 尝试 B：如果 Docker 镜像不可用，则用 spirv-dis 分析 ----------
      - name: Fallback to spirv-dis
        if: steps.malioc_docker.outcome == 'failure'
        run: |
          echo "Malioc not available, performing basic SPIR-V analysis..."
          sudo apt-get update && sudo apt-get install -y spirv-tools
          spirv-dis problem_frag.spv > problem_frag.dis
          echo "===== SPIR-V Disassembly (first 200 lines) =====" 
          head -n 200 problem_frag.dis
          echo ""
          echo "===== Full disassembly saved to problem_frag.dis ====="

      # ---------- 上传结果 ----------
      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: shader-analysis
          path: |
            problem_frag.spv
            problem_frag.dis          # 仅在 fallback 时存在
            malioc_output.txt         # 仅在 malioc 成功时存在
            spv_base64.txt            # 方便核对提取结果
