name: Fix Mali Shader OOB

on:
  push:
    paths:
      - 'original.spv'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-cross glslang-tools spirv-tools python3

      - name: Decompile SPV -> GLSL
        run: spirv-cross original.spv --version 450 --output shader.glsl

      - name: Clamp _33 indices
        run: python3 fix_shader.py shader.glsl shader_fixed.glsl

      - name: Compile GLSL -> SPV
        run: glslangValidator -S comp -V --target-env vulkan1.1 -o fixed.spv shader_fixed.glsl

      - name: Validate
        run: spirv-val --target-env vulkan1.1 fixed.spv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-shader
          path: |
            fixed.spv
            shader_fixed.glsl
            shader.glsl
