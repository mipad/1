name: Ryujinx Andr Bw RustJIT 

on:
  push:
    branches: [ "my" ]
  pull_request:
    branches: [ "my" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      JAVA_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=4g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
      PROJECT_DIR: src/RyujinxAndroid
      ANDROID_NDK_VERSION: "29.0.14206865"
      DOTNET_VERSION: "10.0.201"
      ANDROID_API_LEVEL: "36"
      GRADLE_VERSION: "9.2.0"
      ANDROID_BUILD_TOOLS: "36.0.0"
      RUST_TARGET: "aarch64-linux-android"

    steps:
    - name: Checkout code from GitLab
      uses: actions/checkout@v4
      with:
        github-server-url: https://gitlab.com
        repository: mipad1-group/Test-ryu
        ref: my-nce-vp9-5.1
        path: Test-ryu
        token: ${{ secrets.GITLAB_TOKEN }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        architecture: x64

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Set execution permissions
      working-directory: ${{ github.workspace }}/Test-ryu
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        find . -name "*.sh" -exec chmod +x {} \;

    - name: Setup Gradle Wrapper
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version=${{ env.GRADLE_VERSION }}
        fi

    - name: Install Android SDK Components
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
          "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
          "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
          "cmake;3.22.1" \
          "ndk;${{ env.ANDROID_NDK_VERSION }}"

    - name: Configure Environment Paths
      shell: bash
      run: |
        ANDROID_NDK_HOME="/usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}"
        LLVM_PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "LLVM_PATH=$LLVM_PATH" >> $GITHUB_ENV
        echo "$LLVM_PATH/bin" >> $GITHUB_PATH

    - name: Install Ninja Build
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    # ========== 1. 编译 Rust 库 ==========
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ env.RUST_TARGET }}

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Compile Rust Macro JIT
      working-directory: ${{ github.workspace }}/Test-ryu/src/RyujinxMacroJit
      run: |
        cargo ndk -t arm64-v8a build --release

    # ========== 2. 编译 Ryujinx 原版 APK ==========
    - name: Build APK
      working-directory: ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}
      env:
        OPENSSL_ROOT_DIR: /opt/openssl-x64
      run: |
        # 正常执行 clean 和 assembleRelease
        ./gradlew clean assembleRelease \
          -DllvmToolchainPath=$LLVM_PATH \
          -Dopenssl.root=$OPENSSL_ROOT_DIR \
          -Pandroid.overridePathCheck=true \
          --no-daemon \
          --stacktrace

    # ========== 3. 收集产物 ==========
    - name: Collect Outputs
      run: |
        mkdir -p output_apk
        mkdir -p output_so
        
        # 复制 APK
        find ${{ github.workspace }}/Test-ryu/${{ env.PROJECT_DIR }}/app/build/outputs/apk/release -name "*.apk" -exec cp {} output_apk/ \;
        
        # 复制 .so
        cp ${{ github.workspace }}/Test-ryu/src/RyujinxMacroJit/target/aarch64-linux-android/release/libryujinx_macro_jit.so output_so/

    # ========== 4. 上传产物 ==========
    - name: Upload Original APK
      uses: actions/upload-artifact@v4
      with:
        name: Ryujinx-Original-APK
        path: output_apk/*.apk
        retention-days: 7

    - name: Upload Rust SO File
      uses: actions/upload-artifact@v4
      with:
        name: Rust-JIT-SO
        path: output_so/libryujinx_macro_jit.so
        retention-days: 7
