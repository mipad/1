name: Fix Mali Shader OOB

on:
  push:
    branches: [ "shader" ]
  pull_request:
    branches: [ "shader" ]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools python3

      - name: Disassemble original SPV
        run: |
          spirv-dis original.spv -o original.spvasm
          echo "=== original head ==="
          head -5 original.spvasm

      - name: Patch SPIR-V assembly
        run: python3 spv_clamp.py

      - name: Reassemble
        run: |
          spirv-as --target-env vulkan1.1 -o fixed_raw.spv fixed.spvasm
          spirv-val --target-env vulkan1.1 fixed_raw.spv
          echo "=== reassembly validation passed ==="

      - name: Strip debug
        run: |
          spirv-opt --strip-debug fixed_raw.spv -o fixed.spv
          spirv-val --target-env vulkan1.1 fixed.spv
          echo "=== final validation passed ==="
          ls -la original.spv fixed_raw.spv fixed.spv

      - name: Verify clamps inserted
        run: |
          echo "=== OpSMax count in fixed ==="
          spirv-dis fixed.spv | grep -c "OpSMax"
          echo "=== OpExtInst with GLSLstd450 count in fixed ==="
          spirv-dis fixed.spv | grep -c "OpExtInst.*GLSLstd450" || echo "0"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixed-shader
          path: |
            fixed.spv
            fixed_raw.spv
            original.spvasm
            fixed.spvasm
          retention-days: 30
