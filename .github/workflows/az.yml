name: Scan Vertex SPIR-V (Mali-hazard)

on:                                        
  push:   
    branches: [ "spv-yz" ]  
  pull_request:
    branches: [ "spv-yz" ]

permissions:
  contents: read

jobs:
  scan-vertex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          spirv-dis --version
          spirv-as --version
          spirv-val --version

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/disasm
          : > work/list.txt

          # 收集 .spv（Vertex）
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spv}")"
            cp "$f" "work/${base}.spv"
            echo "${base}|$f" >> work/list.txt
          done < <(find . -type f -name 'Vertex_*.spv' -not -path './.git/*' -not -path './work/*' -print0)

          # 收集 .spvasm（Vertex），汇编后一起处理
          while IFS= read -r -d '' f; do
            base="$(basename "${f%.spvasm}")"
            [ -f "work/${base}.spv" ] && continue
            if spirv-as --target-env vulkan1.1 -o "work/${base}.spv" "$f"; then
              echo "${base}|$f" >> work/list.txt
            fi
          done < <(find . -type f -name 'Vertex_*.spvasm' -not -path './.git/*' -not -path './work/*' -print0)

          echo "Found $(wc -l < work/list.txt) vertex shader(s)"
          cat work/list.txt

      - name: Disassemble
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r base src; do
            spirv-dis "work/${base}.spv" -o "work/disasm/${base}.spvasm"
          done < work/list.txt
          ls -la work/disasm

      - name: Scan hazards
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Vertex shader hazard scan"
            echo ""
            echo "扫描目标：Mali 上已知会触发 device lost / hang 的模式。"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS='|' read -r base src; do
            asm="work/disasm/${base}.spvasm"

            # ---- 1. 敏感指令（顶点里不该出现） ----
            barriers=$(grep -cE 'OpControlBarrier|OpMemoryBarrier' "$asm" || true)
            kills=$(grep -cE 'OpKill|OpDemoteToHelperInvocation|OpTerminateInvocation' "$asm" || true)

            # ---- 2. 可疑模式计数 ----
            bitcast=$(grep -cE 'OpBitcast' "$asm" || true)
            fma=$(grep -cE 'OpExtInst %float %[0-9]+ Fma' "$asm" || true)
            accesschain=$(grep -cE 'OpAccessChain' "$asm" || true)
            imgsample=$(grep -cE 'OpImageSampleImplicitLod|OpImageSampleExplicitLod|OpImageFetch' "$asm" || true)
            imgsample_impl=$(grep -cE 'OpImageSampleImplicitLod' "$asm" || true)

            # ---- 3. 动态索引 vp_c3 / uniform 数组 ----
            # 匹配 OpAccessChain %_ptr_Uniform_float %vp_c3 %int_0 <id> <id>，且后两个索引都不是 int_N 常量
            dyn_idx=$(grep -nE 'OpAccessChain %_ptr_Uniform_float %(vp_c3|support_buffer)' "$asm" \
                      | grep -vE '%int_[0-9]+( %int_[0-9]+)*$' || true)
            dyn_idx_count=$(printf '%s\n' "$dyn_idx" | grep -c . || true)

            # ---- 4. 循环 ----
            loops=$(grep -cE 'OpLoopMerge' "$asm" || true)

            # ---- 写入 Summary ----
            {
              echo "## \`$src\`"
              echo ""
              echo "| 指标 | 数量 | 备注 |"
              echo "|---|---:|---|"
              echo "| OpControlBarrier / OpMemoryBarrier | $barriers | 顶点中应为 0 |"
              echo "| OpKill / OpDemote / OpTerminate | $kills | 顶点中应为 0 |"
              echo "| OpBitcast | $bitcast | 位重解释，Mali 敏感 |"
              echo "| Fma (OpExtInst) | $fma | 长链会造成寄存器压力 |"
              echo "| OpAccessChain | $accesschain | 总量 |"
              echo "| OpImageSample* | $imgsample | 顶点中不应有纹理采样 |"
              echo "| 其中 ImplicitLod | $imgsample_impl | 顶点中应为 0 |"
              echo "| 动态索引 uniform 数组 | $dyn_idx_count | Mali 极不友好 |"
              echo "| OpLoopMerge | $loops | 循环数量 |"
              echo ""

              if [ "$barriers" -gt 0 ] || [ "$kills" -gt 0 ] || [ "$imgsample" -gt 0 ]; then
                echo "⚠️ **发现顶点中不应存在的指令**" >> "$GITHUB_STEP_SUMMARY"
                echo ""
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                grep -nE 'OpControlBarrier|OpMemoryBarrier|OpKill|OpDemoteToHelperInvocation|OpTerminateInvocation|OpImageSampleImplicitLod|OpImageSampleExplicitLod|OpImageFetch' "$asm" | head -50 >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo ""
              fi

              if [ "$dyn_idx_count" -gt 0 ]; then
                echo "### 动态索引 uniform 数组（前 30 条）" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "$dyn_idx" | head -30 >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi

              echo "---" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            } >> "$GITHUB_STEP_SUMMARY"

            # ---- 控制台同步输出 ----
            echo "======== $src ========"
            echo "barriers=$barriers kills=$kills bitcast=$bitcast fma=$fma"
            echo "accesschain=$accesschain imgsample=$imgsample(impl=$imgsample_impl)"
            echo "dynamic_uniform_idx=$dyn_idx_count loops=$loops"

          done < work/list.txt

      - name: Upload disassembly + scan
        uses: actions/upload-artifact@v4
        with:
          name: vertex-scan
          path: work/disasm/*.spvasm
          if-no-files-found: error
          retention-days: 14
