name: Assemble SPIR-V

on:
  workflow_dispatch:
  push:
    branches: [ "shader2" ]
    paths:
      - '*.spvasm'
      - '.github/workflows/assemble-spv.yml'

jobs:
  assemble:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools

      - name: List spvasm
        run: |
          shopt -s nullglob
          files=(*.spvasm)
          echo "spvasm files: ${files[*]:-(none)}"

      - name: Assemble spvasm -> spv
        run: |
          set -e
          shopt -s nullglob
          mkdir -p out
          for src in *.spvasm; do
            base="${src%.spvasm}"
            echo "Assembling $src -> out/${base}.spv"
            spirv-as "$src" -o "out/${base}.spv" --target-env spv1.3
          done
          ls -la out

      - name: Verify round-trip
        run: |
          set -e
          shopt -s nullglob
          for spv in out/*.spv; do
            base="${spv%.spv}"
            spirv-dis "$spv" -o "${base}.disasm.spvasm"
          done
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: assembled-spv
          path: out/
          if-no-files-found: warn
