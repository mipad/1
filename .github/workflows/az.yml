name: Disassemble SPIR-V

on:
  push:
    paths:
      - '*.spv'
  workflow_dispatch:

jobs:
  disassemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SPIRV-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          spirv-dis --version

      - name: Find SPV files in repo root
        id: find
        run: |
          mkdir -p disasm
          shopt -s nullglob
          files=(*.spv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .spv files found in repo root."
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found ${#files[@]} SPV file(s):"
          printf '%s\n' "${files[@]}"
          echo "found=true" >> $GITHUB_OUTPUT

      - name: Disassemble each SPV file
        if: steps.find.outputs.found == 'true'
        run: |
          shopt -s nullglob
          for f in *.spv; do
            base="${f%.spv}"
            echo "=== Disassembling: $f ==="
            # 反汇编为 SPIR-V 汇编（.spvasm）
            spirv-dis "$f" -o "disasm/${base}.spvasm"
            # 附带一份注释更友好的版本（可选）
            spirv-dis --comment --nested-indent "$f" \
              -o "disasm/${base}.annotated.spvasm" || true
            echo "  -> disasm/${base}.spvasm"
          done
          echo "--- Listing output ---"
          ls -lh disasm/

      - name: Grep suspicious instructions (summary)
        if: steps.find.outputs.found == 'true'
        run: |
          echo "## SPIR-V 反汇编摘要" > summary.md
          echo "" >> summary.md
          for f in disasm/*.spvasm; do
            echo "### \`$f\`" >> summary.md
            echo "" >> summary.md
            echo "| 指令 | 数量 |" >> summary.md
            echo "|---|---|" >> summary.md
            for op in OpImageWrite OpImageRead OpVariable OpBitcast OpUMin OpSMin OpUMax OpSMax OpAccessChain; do
              cnt=$(grep -c "$op" "$f" || true)
              echo "| $op | $cnt |" >> summary.md
            done
            # 检查是否还有 StorageBuffer 残留
            sb=$(grep -c "StorageBuffer" "$f" || true)
            if [ "$sb" -gt 0 ]; then
              echo "" >> summary.md
              echo "> ⚠️ **发现 StorageBuffer 残留**：$sb 处" >> summary.md
            fi
            echo "" >> summary.md
          done
          cat summary.md

      - name: Upload disassembly artifacts
        if: steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spv-disassembly
          path: |
            disasm/
            summary.md
          retention-days: 14
