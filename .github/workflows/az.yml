name: Andro 

on:                                        
  push:   
    branches: [ "my" ]  
  pull_request:
    branches: [ "my" ]

jobs: 
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    env:
      JAVA_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=4g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4"
      PROJECT_DIR: src/RyujinxAndroid
      ANDROID_NDK_VERSION: "29.0.14206865"
      DOTNET_VERSION: "10.0.201"
      ANDROID_API_LEVEL: "36"
      GRADLE_VERSION: "9.2.0"
      ANDROID_BUILD_TOOLS: "36.0.0"

    steps:
    # ========== 1. 从 GitLab 检出代码（私有仓库） ==========
    - name: Checkout code from GitLab
      uses: actions/checkout@v4
      with:
        github-server-url: https://gitlab.com
        repository: mipad1-group/Test-ryu
        ref: my-nce
        path: Test-ryu
        token: ${{ secrets.GITLAB_TOKEN }}

    # ========== 2. 环境配置 ==========
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        architecture: x64

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        # 关键：显式覆盖默认 packages，去掉已被 Google 移除的 'tools' 包
        packages: 'platform-tools'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # ========== 3. 缓存优化 ==========
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # ========== 4. 权限和Gradle设置 ==========
    - name: Set execution permissions
      working-directory: ${{ github.workspace }}/Test-ryu
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
