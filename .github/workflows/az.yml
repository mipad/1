name: Compile Fragment Shaders to SPIR-V

on:
  push:
    branches: [ "spv" ]
  pull_request:
    branches: [ "spv" ]
  workflow_dispatch:

jobs:
  compile-frag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: mipad/1
          ref: spv
          path: 1

      - name: Install glslang-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Create output directory
        run: mkdir -p spirv_output

      - name: Compile shaders to SPIR-V
        run: |
          # 递归查找所有 .frag 和 .vert 文件
          find 1 -type f \( -name "*.frag" -o -name "*.vert" \) | while read file; do
            rel_path="${file#1/}"
            base="${rel_path%.*}"              # 去掉扩展名 .frag 或 .vert
            out_dir="spirv_output/$(dirname "$rel_path")"
            mkdir -p "$out_dir"
            echo "Compiling $file -> $out_dir/${base}.spv"
            glslangValidator -V "$file" -o "$out_dir/${base}.spv"
          done

      - name: List compiled SPIR-V files
        run: find spirv_output -name "*.spv" | sort

      - name: Upload SPIR-V artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spirv-fragment-binaries
          path: spirv_output/
